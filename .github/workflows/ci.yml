name: CI

on:
  push:
    branches: [nexus-pulse-autopilot]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Tests
        run: npm test
      - name: Production build
        run: npm run build
        env:
          # Build-time placeholder only; real secrets live in Railway.
          ENCRYPTION_KEY: ci-build-placeholder-not-a-secret-0123456789

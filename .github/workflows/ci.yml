name: CI

on:
  push:
    branches: [nexus-pulse-autopilot]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install ffmpeg
        # The media tests render audio and video with ffmpeg and ffprobe,
        # which the runner image does not include.
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends ffmpeg
          ffmpeg -version | head -1
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Tests
        run: npm test
      - name: Production build
        run: npm run build
        env:
          # Build-time placeholder only; real secrets live in Railway.
          ENCRYPTION_KEY: ci-build-placeholder-not-a-secret-0123456789

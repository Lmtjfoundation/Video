<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Ghost Post</title>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Oswald:wght@400;600;700&family=Special+Elite&display=swap" rel="stylesheet">
<style>html,body{margin:0;background:#000}canvas{display:block;width:100vw;height:auto}</style>
</head>
<body>
<canvas id="c" width="1920" height="1080"></canvas>
<script>
// GHOST POST: a procedural motion-graphics short. Every frame is a pure function of time:
// render(t) draws frame t. Timing comes from cues.json (injected as window.CUES), the same
// file the audio script reads, so picture and sound stay locked.
const Q = window.CUES;
const W = 1920, H = 1080, BAR = 138, GROUND = 820;
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
const INK = '#07060a', RED = '#d7263d', BONE = '#f4efe6', GOLD = '#ffcf33';

// ---------- math ----------
const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
const lerp = (a, b, k) => a + (b - a) * k;
const inv = (a, b, x) => clamp((x - a) / (b - a), 0, 1);
const smooth = x => x * x * (3 - 2 * x);
const eOut = x => 1 - Math.pow(1 - x, 3);
const eIn = x => x * x * x;
const eIO = x => x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const eBack = x => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };
function hash(n) {
  let a = (Math.floor(n) * 2654435761) >>> 0;
  a = Math.imul(a ^ (a >>> 15), 1 | a);
  a ^= a + Math.imul(a ^ (a >>> 7), 61 | a);
  return ((a ^ (a >>> 14)) >>> 0) / 4294967296;
}
function noise1(x) { const i = Math.floor(x), f = x - i; return lerp(hash(i), hash(i + 1), smooth(f)) * 2 - 1; }
function mulberry(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

// ---------- time warp (bullet time) ----------
function speedAt(t) {
  const b = Q.bt;
  if (t < b.slowStart) return 1;
  if (t < b.slowFull) return lerp(1, b.minSpeed, smooth(inv(b.slowStart, b.slowFull, t)));
  if (t < b.fastStart) return b.minSpeed;
  if (t < b.fastFull) return lerp(b.minSpeed, 1, smooth(inv(b.fastStart, b.fastFull, t)));
  return 1;
}
const WSTEP = 0.001, WN = Math.ceil(Q.duration / WSTEP) + 2;
const warpTab = new Float64Array(WN);
for (let i = 1; i < WN; i++) warpTab[i] = warpTab[i - 1] + speedAt((i - 0.5) * WSTEP) * WSTEP;
function warp(t) {
  const x = t / WSTEP, i = Math.floor(x);
  if (i >= WN - 1) return warpTab[WN - 1] + (t - (WN - 1) * WSTEP);
  return lerp(warpTab[i], warpTab[i + 1], x - i);
}
const RT_SNAP = warp(Q.bt.snap);

// ---------- camera ----------
const REF = { x: 1035, y: 560 };
let CAM = { x: 1035, y: 560, z: 1, rot: 0 };
let SHAKE = { x: 0, y: 0, r: 0 };
let T = 0, RT = 0;
let LIGHTS = [];
function setLayer(p) {
  const z = 1 + (CAM.z - 1) * p;
  const cx = REF.x + (CAM.x - REF.x) * p, cy = REF.y + (CAM.y - REF.y) * p;
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.translate(W / 2 + SHAKE.x * p, H / 2 + SHAKE.y * p);
  ctx.rotate((CAM.rot + SHAKE.r) * p);
  ctx.scale(z, z);
  ctx.translate(-cx, -cy);
}
function toScreen(x, y, p = 1) {
  const z = 1 + (CAM.z - 1) * p;
  const cx = REF.x + (CAM.x - REF.x) * p, cy = REF.y + (CAM.y - REF.y) * p;
  const dx = (x - cx) * z, dy = (y - cy) * z, r = (CAM.rot + SHAKE.r) * p;
  const c = Math.cos(r), s = Math.sin(r);
  return [W / 2 + SHAKE.x * p + dx * c - dy * s, H / 2 + SHAKE.y * p + dx * s + dy * c];
}
function computeShake(t) {
  let a = 0;
  const add = (s, amp, decay = 16) => { if (t >= s && t - s < 0.6) a += amp * Math.exp(-(t - s) * decay); };
  Q.deuceShots.forEach((s, i) => add(s, i === 0 ? 26 : 9));
  Q.ghostShots.forEach(g => add(g.t, 5));
  Q.reloadHits.forEach(h => add(h.t, 14));
  add(Q.reload.magIn, 4); add(Q.reload.rackFwd, 5);
  add(Q.cards.deuce, 10, 12); add(Q.cards.ghost, 12, 12);
  add(Q.bt.snap, 34, 7); add(Q.title.t, 18, 9);
  SHAKE = { x: a * noise1(t * 40), y: a * noise1(t * 40 + 77), r: a * 0.0007 * noise1(t * 30 + 33) };
}

// ---------- drawing helpers ----------
function seg(c, a, b, w) { c.lineWidth = w; c.beginPath(); c.moveTo(a[0], a[1]); c.lineTo(b[0], b[1]); c.stroke(); }
function circ(c, p, r) { c.beginPath(); c.arc(p[0], p[1], r, 0, Math.PI * 2); c.fill(); }
function polyF(c, pts) { c.beginPath(); c.moveTo(pts[0][0], pts[0][1]); for (let i = 1; i < pts.length; i++) c.lineTo(pts[i][0], pts[i][1]); c.closePath(); c.fill(); }
function glow(x, y, r, col, a) {
  if (a <= 0.002) return;
  const g = ctx.createRadialGradient(x, y, 0, x, y, r);
  g.addColorStop(0, col.replace('A', a.toFixed(3)));
  g.addColorStop(1, col.replace('A', '0'));
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
}
function star(c, x, y, spikes, r1, r2, rot) {
  c.beginPath();
  for (let i = 0; i < spikes * 2; i++) {
    const r = i % 2 ? r2 : r1 * (0.75 + 0.5 * hash(i * 13 + spikes)), a = rot + i * Math.PI / spikes;
    const px = x + Math.cos(a) * r, py = y + Math.sin(a) * r;
    i ? c.lineTo(px, py) : c.moveTo(px, py);
  }
  c.closePath();
}

// ---------- figures (forward kinematics, facing +x, hip at origin) ----------
const L = { thigh: 95, shin: 95, torso: 125, neck: 14, headR: 25, upper: 68, fore: 64 };
const D2R = Math.PI / 180;
function J(p) {
  const dir = a => [Math.sin(a * D2R), Math.cos(a * D2R)];
  const add = (o, d, l) => [o[0] + d[0] * l, o[1] + d[1] * l];
  const up = [Math.sin(p.lean * D2R), -Math.cos(p.lean * D2R)];
  const hip = [0, 0], neck = add(hip, up, L.torso);
  const hu = [Math.sin((p.lean + p.head) * D2R), -Math.cos((p.lean + p.head) * D2R)];
  const head = add(neck, hu, L.neck + L.headR);
  const sh = add(neck, up, -10);
  const eF = add(sh, dir(p.uF), L.upper), hF = add(eF, dir(p.fF), L.fore);
  const eB = add(sh, dir(p.uB), L.upper), hB = add(eB, dir(p.fB), L.fore);
  const kF = add(hip, dir(p.tF), L.thigh), fF = add(kF, dir(p.sF), L.shin);
  const kB = add(hip, dir(p.tB), L.thigh), fB = add(kB, dir(p.sB), L.shin);
  return { p, up, hu, hip, neck, head, sh, eF, hF, eB, hB, kF, fF, kB, fB };
}
const groundHip = j => GROUND - Math.max(j.fF[1], j.fB[1], j.kF[1], j.kB[1]) - 9;
function mix(a, b, k) { const r = {}; for (const key in a) r[key] = lerp(a[key], b[key], k); return r; }
function walkPose(ph, amp, armAmp, base) {
  const s = Math.sin(ph), c = Math.cos(ph);
  const tF = amp * s, tB = -amp * s;
  return Object.assign({}, base, {
    tF, sF: tF - amp * 1.4 * Math.max(0, c), tB, sB: tB - amp * 1.4 * Math.max(0, -c),
    uF: -armAmp * s, fF: -armAmp * s + 10, uB: armAmp * s, fB: armAmp * s + 10,
  });
}
function shoe(c, f) {
  c.beginPath(); c.moveTo(f[0] - 9, f[1] - 7); c.lineTo(f[0] + 18, f[1] - 3);
  c.quadraticCurveTo(f[0] + 27, f[1] + 8, f[0] + 16, f[1] + 9); c.lineTo(f[0] - 11, f[1] + 9); c.closePath(); c.fill();
}
function gunDir(j) { const dx = j.hF[0] - j.eF[0], dy = j.hF[1] - j.eF[1], l = Math.hypot(dx, dy); return [dx / l, dy / l]; }
function drawBody(c, j, kind, flutter, gun) {
  c.lineCap = 'round'; c.lineJoin = 'round';
  const n = [-j.up[1], j.up[0]];
  const P = (o, v, s) => [o[0] + v[0] * s, o[1] + v[1] * s];
  const lw = kind === 'ghost' ? [32, 27] : [28, 23];
  seg(c, j.sh, j.eB, 20); seg(c, j.eB, j.hB, 17); circ(c, j.hB, 10);
  seg(c, j.hip, j.kB, lw[0]); seg(c, j.kB, j.fB, lw[1]); shoe(c, j.fB);
  seg(c, j.hip, j.kF, lw[0]); seg(c, j.kF, j.fF, lw[1]); shoe(c, j.fF);
  if (kind === 'deuce') {
    polyF(c, [P(j.neck, n, 24), P(j.hip, n, 21), P(j.hip, n, -21), P(j.neck, n, -24)]);
    const hemF = [(j.kF[0]) * 1.22 + 14, (j.kF[1]) * 1.22 + 6];
    const hemB = [(j.kB[0]) * 1.22 - 22 - flutter, (j.kB[1]) * 1.22 + 2 - flutter * 0.3];
    const a = P(j.neck, n, 27), b = P(j.neck, n, -27), hf = P(j.hip, n, 28), hb = P(j.hip, n, -31);
    c.beginPath(); c.moveTo(a[0], a[1]); c.lineTo(hf[0], hf[1]); c.lineTo(hemF[0], hemF[1]);
    c.quadraticCurveTo((hemF[0] + hemB[0]) / 2, Math.max(hemF[1], hemB[1]) + 12, hemB[0], hemB[1]);
    c.lineTo(hb[0], hb[1]); c.lineTo(b[0], b[1]); c.closePath(); c.fill();
    polyF(c, [P(j.neck, n, -18), P(P(j.neck, j.up, 16), n, -6), P(j.neck, n, 12)]);
  } else {
    const lo = P(j.hip, j.up, -16);
    polyF(c, [P(j.neck, n, 25), P(j.hip, n, 28), P(lo, n, 26), P(lo, n, -29), P(j.hip, n, -28), P(j.neck, n, -27)]);
  }
  seg(c, j.neck, P(j.neck, j.hu, L.neck + 6), 17);
  c.save(); c.translate(j.head[0], j.head[1]); c.rotate(Math.atan2(j.hu[0], -j.hu[1]));
  circ(c, [0, 0], L.headR);
  if (kind === 'deuce') {
    polyF(c, [[19, -9], [31, 3], [20, 7]]);
    polyF(c, [[2, 14], [22, 10], [20, 24], [2, 26]]);
    c.beginPath(); c.ellipse(4, -15, 45, 6.5, 0, 0, Math.PI * 2); c.fill();
    polyF(c, [[-20, -16], [-17, -47], [-3, -42], [13, -47], [19, -16]]);
  } else {
    c.beginPath(); c.moveTo(24, 26); c.quadraticCurveTo(36, -14, 22, -30);
    c.quadraticCurveTo(4, -46, -20, -50); c.quadraticCurveTo(-34, -40, -40, -16);
    c.quadraticCurveTo(-46, 22, -30, 44); c.lineTo(10, 40); c.closePath(); c.fill();
  }
  c.restore();
  seg(c, j.sh, j.eF, 21); seg(c, j.eF, j.hF, 18);
  if (gun) {
    c.save(); c.translate(j.hF[0], j.hF[1]); c.rotate(Math.atan2(j.hF[1] - j.eF[1], j.hF[0] - j.eF[0]));
    c.fillRect(-4, -9, 48, 11); c.fillRect(34, -12, 5, 4);
    c.beginPath(); c.moveTo(-3, 0); c.lineTo(13, 0); c.lineTo(9, 27); c.lineTo(-7, 25); c.closePath(); c.fill();
    c.restore();
  }
  circ(c, j.hF, 11.5);
}
function localToWorld(st, p) { return [st.x + st.f * p[0], st.y + p[1]]; }
function muzzleLocal(j) { const d = gunDir(j); return [j.hF[0] + d[0] * 47 + d[1] * 3, j.hF[1] + d[1] * 47 - d[0] * 3]; }
function ejectLocal(j) { const d = gunDir(j); return [j.hF[0] + d[0] * 16 + d[1] * 12, j.hF[1] + d[1] * 16 - d[0] * 12]; }

// ---------- character timelines ----------
const DSTAND = { lean: 2, head: 0, tF: 5, sF: 2, tB: -5, sB: -3, uF: 8, fF: 12, uB: -8, fB: -4 };
const DAIM = { lean: -4, head: -4, tF: 16, sF: 6, tB: -14, sB: -4, uF: 86, fF: 90, uB: -10, fB: -18 };
const DAIM2 = { lean: -2, head: -6, tF: 16, sF: 6, tB: -14, sB: -4, uF: 84, fF: 90, uB: 72, fB: 88 };
const DDIVE = { lean: 70, head: -35, tF: -35, sF: -70, tB: -55, sB: -85, uF: 108, fF: 100, uB: 100, fB: 96 };
const DKNEEL = { lean: 14, head: -6, tF: 90, sF: 2, tB: 2, sB: -88, uF: 35, fF: 165, uB: 28, fB: 150 };
const GSTAND = { lean: -1, head: 8, tF: 3, sF: 1, tB: -3, sB: -1, uF: 3, fF: 2, uB: -4, fB: -3 };
const GAIM = { lean: -3, head: -2, tF: 12, sF: 4, tB: -10, sB: -3, uF: 88, fF: 90, uB: -6, fB: -10 };
const HIP_AIM = groundHip(J(DAIM)), HIP_KNEEL = groundHip(J(DKNEEL));

function standoffPose(rt) {
  const p = Object.assign({}, DSTAND);
  p.lean += 0.8 * Math.sin(rt * 2.2);
  const k = smooth(inv(9.6, 10.4, rt));
  p.uF = lerp(8, -4, k); p.fF = lerp(12, 22, k);
  return p;
}
function recoil(rt) { let r = 0; for (const s of Q.deuceShots) if (rt >= s && rt - s < 0.4) r += Math.exp(-(rt - s) * 22); return r; }
function deuceAt(rt, t) {
  if (rt < 4.0) return null;
  let x = 420, y = null, pose, flutter = 4 * Math.sin(rt * 3.1) + 3 * Math.sin(rt * 5.3);
  if (rt < 6.5) {
    x = rt < 6.1 ? lerp(-100, 400, inv(4, 6.1, rt)) : lerp(400, 420, eOut(inv(6.1, 6.5, rt)));
    const ph = (x + 100) / 165 * Math.PI * 2, k = smooth(inv(6.1, 6.5, rt));
    pose = mix(walkPose(ph, 24, 18, DSTAND), DSTAND, k); flutter += 10 * (1 - k) * Math.sin(ph * 2);
  } else if (rt < 12.42) pose = standoffPose(rt);
  else if (rt < 13.5) pose = mix(standoffPose(12.42), DAIM, eOut(inv(12.42, 12.5, rt)));
  else if (rt < 14.3) {
    if (rt < 13.85) { const a = inv(13.5, 13.85, rt); pose = mix(DAIM, DDIVE, eOut(a)); x = lerp(420, 480, a); y = lerp(HIP_AIM, 598, eOut(a)); }
    else { const b = inv(13.85, 14.3, rt); pose = mix(DDIVE, DKNEEL, eIO(b)); x = lerp(480, 545, b); y = lerp(598, HIP_KNEEL, eIn(b)); }
    flutter += 18;
  } else if (rt < 16.75) { x = 545; pose = Object.assign({}, DKNEEL); pose.lean += 1.2 * Math.sin(rt * 3); }
  else if (rt < 17.0) { x = 545; pose = mix(DKNEEL, DAIM, eOut(inv(16.75, 17.0, rt))); }
  else { x = 545; pose = mix(DAIM, DAIM2, smooth(inv(19.9, 20.25, rt))); }
  if (t >= Q.aftermath.lower0) pose = mix(pose, DSTAND, smooth(inv(Q.aftermath.lower0, Q.aftermath.lower1, t)));
  pose = Object.assign({}, pose);
  const r = recoil(rt);
  if (rt >= 12.5 && (rt < 13.5 || rt >= 16.85)) { pose.fF += 16 * r; pose.uF += 6 * r; pose.lean -= 2 * r; }
  const j = J(pose);
  if (y === null) y = groundHip(j);
  return { x, y, j, f: 1, flutter };
}
function ghostAt(rt, t) {
  if (rt < Q.ghostAppear) return null;
  const rw = Math.min(rt, RT_SNAP);
  let x = 1650, pose = Object.assign({}, GSTAND);
  pose.lean += 0.6 * Math.sin(rt * 1.7);
  if (rw >= 13.55 && rw < 15.3) {
    const k = smooth(inv(13.55, 13.7, rw)) * (1 - smooth(inv(14.9, 15.25, rw)));
    pose = mix(pose, GAIM, k);
    let r = 0; for (const s of Q.ghostShots) if (rw >= s.t && rw - s.t < 0.4) r += Math.exp(-(rw - s.t) * 22);
    pose.fF += 14 * r; pose.uF += 5 * r;
  }
  if (rw >= 16.75) {
    x = lerp(1650, 1380, inv(16.75, 20.8, rw));
    const ph = (1650 - x) / 150 * Math.PI * 2;
    pose = mix(pose, walkPose(ph, 16, 5, GSTAND), smooth(inv(16.75, 17.1, rw)));

  const j = J(pose);
  return { x, y: groundHip(j), j, f: -1 };
}
const ghostChest = g => localToWorld(g, [g.j.neck[0] * 0.5, g.j.neck[1] * 0.55]);
function ghostGlitch(rt, t) {
  let g = 0;
  for (let i = 0; i < Q.deuceShots.length - 1; i++) { const s = Q.deuceShots[i]; if (rt >= s && rt - s < 0.5) g += Math.exp(-(rt - s - 0.01) * 14); }
  if (t > Q.bt.snap) g += 2.4 * Math.exp(-(t - Q.bt.snap) * 3);
  return g;
}

// ---------- prebuilt layers ----------
const far = document.createElement('canvas'); far.width = 3600; far.height = 520;
(() => {
  const g = far.getContext('2d'); let x = 0, i = 0;
  while (x < 3600) {
    const w = 60 + hash(i * 3 + 1) * 140, h = 90 + hash(i * 3 + 2) * 300 * (0.55 + 0.45 * Math.sin(x / 520 + 1));
    g.fillStyle = '#1d0a13'; g.fillRect(x, 520 - h, w - 4, h);
    if (hash(i * 5 + 3) < 0.22) g.fillRect(x + w / 2, 520 - h - 44, 3, 44);
    for (let wy = 520 - h + 14; wy < 506; wy += 18) for (let wx = x + 8; wx < x + w - 12; wx += 14) {
      const r = hash(i * 977 + wx * 13 + wy * 7);
      if (r < 0.07) { g.fillStyle = r < 0.025 ? 'rgba(255,205,130,0.6)' : 'rgba(255,120,90,0.35)'; g.fillRect(wx, wy, 6, 8); g.fillStyle = '#1d0a13'; }
    }
    x += w; i++;
  }
})();
const vignette = document.createElement('canvas'); vignette.width = W; vignette.height = H;
(() => {
  const g = vignette.getContext('2d');
  const r = g.createRadialGradient(W / 2, H / 2, H * 0.32, W / 2, H / 2, H * 1.05);
  r.addColorStop(0, 'rgba(0,0,0,0)'); r.addColorStop(1, 'rgba(0,0,0,0.72)');
  g.fillStyle = r; g.fillRect(0, 0, W, H);
})();
const grains = [0, 1, 2, 3].map(k => {
  const c = document.createElement('canvas'); c.width = 960; c.height = 540;
  const g = c.getContext('2d'), id = g.createImageData(960, 540), rnd = mulberry(1000 + k);
  for (let i = 0; i < id.data.length; i += 4) { const v = rnd() * 255; id.data[i] = id.data[i + 1] = id.data[i + 2] = v; id.data[i + 3] = 255; }
  g.putImageData(id, 0, 0); return c;
});
const gOff = document.createElement('canvas'); const gctx = gOff.getContext('2d');
const tintA = document.createElement('canvas'); const tintActx = tintA.getContext('2d');
const tcv = document.createElement('canvas'); tcv.width = W; tcv.height = 420; const tctx = tcv.getContext('2d');

// ---------- world layers ----------
function drawSky() {
  setLayer(0.1);
  const g = ctx.createLinearGradient(0, 0, 0, 800);
  g.addColorStop(0, '#040208'); g.addColorStop(0.35, '#170410'); g.addColorStop(0.62, '#3e0918');
  g.addColorStop(0.85, '#9a132b'); g.addColorStop(1, '#ff5a2a');
  ctx.fillStyle = g; ctx.fillRect(-3000, -2000, 8000, 2800);
  ctx.fillStyle = '#ff5a2a'; ctx.fillRect(-3000, 800, 8000, 1500);
  ctx.fillStyle = 'rgba(255,230,220,0.5)';
  for (let i = 0; i < 40; i++) { const sx = -400 + hash(i * 7) * 2900, sy = -100 + hash(i * 11) * 420; ctx.globalAlpha = 0.2 + 0.5 * hash(i * 3 + Math.floor(RT * 3) * 0); ctx.fillRect(sx, sy, 2, 2); }
  ctx.globalAlpha = 1;
}
let MOON = [0, 0];
function drawMoon() {
  setLayer(0.08);
  const mx = 1035, my = 400, r = 140;
  ctx.globalCompositeOperation = 'lighter';
  let g = ctx.createRadialGradient(mx, my, r * 0.8, mx, my, r * 4.2);
  g.addColorStop(0, 'rgba(255,120,90,0.38)'); g.addColorStop(1, 'rgba(255,60,60,0)');
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(mx, my, r * 4.2, 0, 7); ctx.fill();
  ctx.globalCompositeOperation = 'source-over';
  g = ctx.createRadialGradient(mx - 30, my - 30, 10, mx, my, r);
  g.addColorStop(0, '#fff1e4'); g.addColorStop(0.7, '#f7c9b0'); g.addColorStop(1, '#e98f7c');

  g.addColorStop(0, '#1d050c'); g.addColorStop(0.45, '#3e0c18'); g.addColorStop(1, '#110307');
  ctx.fillStyle = g; ctx.fillRect(-60, -60, W + 120, H + 120);
  ctx.save(); ctx.globalCompositeOperation = 'lighter';
  g = ctx.createLinearGradient(0, 380, 0, 520); g.addColorStop(0, 'rgba(255,90,110,0)'); g.addColorStop(0.5, 'rgba(255,90,110,0.16)'); g.addColorStop(1, 'rgba(255,90,110,0)');
  ctx.fillStyle = g; ctx.fillRect(-60, 380, W + 120, 140);
  ctx.restore();
  ctx.strokeStyle = 'rgba(255,230,215,0.30)'; ctx.lineWidth = 5; ctx.beginPath(); ctx.moveTo(-60, 870); ctx.lineTo(W + 60, 830); ctx.stroke();
  ctx.fillStyle = 'rgba(30,8,14,0.95)'; ctx.fillRect(-60, -60, W + 120, BAR + 110);
  for (const h of Q.reloadHits) if (t >= h.t) {
    const a = t - h.t;
    ctx.fillStyle = '#050203'; circ(ctx, [h.x, h.y], 13); ctx.strokeStyle = 'rgba(255,215,200,0.55)'; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(h.x, h.y, 17, 0, 7); ctx.stroke();
    if (a < 0.4) {
      ctx.save(); ctx.globalCompositeOperation = 'lighter';
      for (let k = 0; k < 26; k++) { const an = Math.PI * 2 * hash(k + h.t * 10), sp = 500 + 900 * hash(k * 7), x = h.x + Math.cos(an) * sp * a, y = h.y + Math.sin(an) * sp * a + 1200 * a * a; ctx.strokeStyle = `rgba(255,220,140,${1 - a / 0.4})`; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x - Math.cos(an) * 26, y - Math.sin(an) * 26); ctx.stroke(); }
      glow(h.x, h.y, 300, 'rgba(255,190,120,A)', 0.6 * Math.exp(-a * 10));
      ctx.restore();
    }
  }
  // drifting glass glints
  ctx.save(); ctx.globalCompositeOperation = 'lighter';
  for (let k = 0; k < 30; k++) { const a = (t - R.start + hash(k) * 2) % 2.2, x = 200 + hash(k * 3) * 1500 + a * 40, y = BAR + a * 330; ctx.fillStyle = `rgba(220,235,255,${0.5 * (1 - a / 2.2)})`; ctx.save(); ctx.translate(x, y); ctx.rotate(a * 6 + k); ctx.fillRect(-4, -1.5, 8, 3); ctx.restore(); }
  ctx.restore();
  // Deuce's profile at the left edge
  const br = 1 + 0.015 * Math.sin(t * 6);
  ctx.save(); ctx.translate(250, 560); ctx.scale(br, br);
  for (const pass of [0, 1]) {
    ctx.fillStyle = pass ? INK : 'rgba(255,90,70,0.8)';
    ctx.save(); if (!pass) ctx.translate(6, -4);
    ctx.beginPath(); ctx.ellipse(-40, 0, 230, 260, 0, 0, 7); ctx.fill();
    ctx.beginPath(); ctx.moveTo(150, -40); ctx.lineTo(225, 40); ctx.lineTo(160, 70); ctx.fill();
    ctx.beginPath(); ctx.ellipse(-20, -230, 380, 44, -0.04, 0, 7); ctx.fill();
    ctx.beginPath(); ctx.moveTo(-230, -240); ctx.lineTo(-200, -470); ctx.lineTo(160, -470); ctx.lineTo(190, -240); ctx.fill();
    ctx.fillRect(-300, 200, 420, 600);
    ctx.restore();
  }
  ctx.restore();
  // pistol
  const up = smooth(inv(16.25, 16.7, t));
  ctx.save(); ctx.translate(1040, 560); ctx.rotate(lerp(-0.12, -0.75, up)); ctx.scale(2.6, 2.6);
  const rack = t < R.rackBack ? 0 : t < R.rackFwd ? eOut(inv(R.rackBack, R.rackBack + 0.05, t)) : 1 - eIn(inv(R.rackFwd, R.rackFwd + 0.04, t));
  // magazine
  let magY = 0, magVis = true;
  if (t >= R.magOut && t < R.magIn - 0.33) { const a = t - R.magOut; magY = 0.5 * 1300 * a * a; }
  else if (t >= R.magIn - 0.33 && t < R.magIn) { magY = 90 * (1 - eOut(inv(R.magIn - 0.33, R.magIn, t))); }
  if (t >= R.magOut && t < R.magIn - 0.33 && magY > 260) magVis = false;
  if (magVis) { ctx.save(); ctx.translate(32, 10 + magY); ctx.rotate(0.18); ctx.fillStyle = '#16161a'; ctx.fillRect(-14, 0, 30, 70); ctx.fillStyle = '#2a2a30'; ctx.fillRect(-16, 66, 34, 8); if (t >= R.magIn - 0.33) { ctx.fillStyle = '#d9a441'; ctx.fillRect(-10, -4, 18, 5); } ctx.restore(); }
  ctx.fillStyle = '#0a0a0d';
  ctx.beginPath(); ctx.moveTo(12, 0); ctx.lineTo(56, 0); ctx.lineTo(46, 80); ctx.lineTo(4, 78); ctx.closePath(); ctx.fill();
  ctx.fillRect(10, -2, 150, 14);
  ctx.strokeStyle = '#0a0a0d'; ctx.lineWidth = 4; ctx.beginPath(); ctx.arc(70, 18, 14, 0, Math.PI); ctx.stroke();
  ctx.save(); ctx.translate(-18 * rack, 0);
  ctx.fillStyle = '#131317'; ctx.fillRect(0, -26, 168, 26);
  ctx.strokeStyle = 'rgba(200,200,210,0.35)'; ctx.lineWidth = 1; for (let i = 6; i < 34; i += 5) { ctx.beginPath(); ctx.moveTo(i, -24); ctx.lineTo(i, -4); ctx.stroke(); }
  ctx.fillStyle = 'rgba(255,120,110,0.5)'; ctx.fillRect(0, -27, 168, 2);
  ctx.fillStyle = '#050506'; ctx.fillRect(88, -22, 26, 10);
  ctx.restore();
  // hands: dark silhouettes with a red rim, like the rest of the film
  const handPass = (draw) => { for (const pass of [0, 1]) { ctx.save(); ctx.fillStyle = ctx.strokeStyle = pass ? '#1d100a' : 'rgba(255,80,70,0.7)'; if (!pass) ctx.translate(1.6, -1.2); ctx.lineCap = 'round'; ctx.lineJoin = 'round'; draw(); ctx.restore(); } };
  handPass(() => {
    polyF(ctx, [[-2, 14], [20, 10], [24, 70], [-30, 150], [-70, 150], [-36, 60]]);
    for (let i = 0; i < 4; i++) { ctx.lineWidth = 11; ctx.beginPath(); ctx.moveTo(18, 22 + i * 12); ctx.lineTo(58, 20 + i * 12.5); ctx.stroke(); }
    ctx.lineWidth = 11; ctx.beginPath(); ctx.moveTo(4, 12); ctx.lineTo(44, 6); ctx.stroke();
  });
  let lh = null;
  if (t >= R.magIn - 0.45 && t < R.magIn + 0.15) lh = 'mag';
  else if (t >= R.rackBack - 0.15 && t < R.rackFwd + 0.12) lh = 'rack';
  if (lh === 'mag') handPass(() => {
    const y = 84 + magY; polyF(ctx, [[0, y - 6], [66, y - 10], [70, y + 18], [40, y + 70], [-10, y + 70], [-6, y + 18]]);
    for (let i = 0; i < 3; i++) { ctx.lineWidth = 10; ctx.beginPath(); ctx.moveTo(60, y + i * 11); ctx.lineTo(62, y - 22 + i * 11); ctx.stroke(); }
  });
  if (lh === 'rack') handPass(() => {
    const x = -14 - 18 * rack; polyF(ctx, [[x, -36], [x + 34, -34], [x + 36, 6], [x - 10, 60], [x - 60, 60], [x - 20, -4]]);
    for (let i = 0; i < 3; i++) { ctx.lineWidth = 9; ctx.beginPath(); ctx.moveTo(x + 6 + i * 9, -34); ctx.lineTo(x + 8 + i * 9, -4); ctx.stroke(); }
  });
  ctx.restore();
}

// ---------- text ----------
function typed(cue, t) {
  if (t < cue.t || t > cue.hide + 0.3) return;
  const n = Math.min(cue.text.length, Math.floor((t - cue.t) * cue.cps));
  const a = 1 - inv(cue.hide, cue.hide + 0.3, t);
  ctx.save(); ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = a;
  ctx.font = `${cue.size}px "Special Elite"`; ctx.textBaseline = 'alphabetic';
  const center = cue.x === 960; ctx.textAlign = 'left';
  const full = ctx.measureText(cue.text).width, x = center ? cue.x - full / 2 : cue.x;
  const s = cue.text.slice(0, n);
  ctx.fillStyle = 'rgba(0,0,0,0.6)'; ctx.fillText(s, x + 3, cue.y + 3);
  ctx.fillStyle = BONE; ctx.fillText(s, x, cue.y);
  if (n < cue.text.length || Math.floor(t * 2.5) % 2 === 0) { const w = ctx.measureText(s).width; ctx.fillStyle = RED; ctx.fillRect(x + w + 4, cue.y - cue.size * 0.75, cue.size * 0.45, cue.size * 0.85); }
  ctx.restore();
}
function glitchText(txt, font, x, y, color, shadow, amt, seed, align) {
  tctx.setTransform(1, 0, 0, 1, 0, 0); tctx.clearRect(0, 0, W, 420);
  tctx.font = font; tctx.textAlign = align; tctx.textBaseline = 'alphabetic';
  if (shadow) { tctx.fillStyle = shadow; tctx.fillText(txt, x + 7, 287); }
  tctx.fillStyle = color; tctx.fillText(txt, x, 280);
  ctx.save(); ctx.setTransform(1, 0, 0, 1, 0, 0);
  if (amt > 0.02) {
    ctx.globalCompositeOperation = 'lighter'; ctx.globalAlpha = Math.min(0.8, amt);
    ctx.filter = 'none';
    ctx.drawImage(tcv, -14 * amt, y - 280); ctx.drawImage(tcv, 14 * amt, y - 280);
    ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = 1;
  }
  const n = 14, sh = 420 / n, fr = Math.floor(T * 24);
  for (let i = 0; i < n; i++) {
    const dx = amt > 0.02 && hash(seed * 31 + i * 7 + fr * 3) < 0.45 ? (hash(seed + i * 13 + fr) - 0.5) * 160 * amt : 0;
    ctx.drawImage(tcv, 0, i * sh, W, sh, dx, y - 280 + i * sh, W, sh);
  }
  ctx.restore();
}
function nameCards(t) {
  const c = Q.cards;
  if (t >= c.deuce && t < 6.4) {
    const k = inv(c.deuce, c.deuce + 0.18, t), s = lerp(2.6, 1, eOut(k)), a = 1 - inv(6.0, 6.35, t);
    ctx.save(); ctx.globalAlpha = a * Math.min(1, k * 3);
    ctx.setTransform(s, 0, 0, s, 150 * (1 - s) + 0, 300 * (1 - s));
    const gl = Math.max(0, 1 - (t - c.deuce) * 5) + (hash(Math.floor(t * 20)) < 0.06 ? 0.4 : 0);
    ctx.restore();
    ctx.save(); ctx.globalAlpha = a * Math.min(1, k * 3);
    ctx.translate(150, 330); ctx.scale(s, s); ctx.translate(-150, -330);
    glitchTextT('DEUCE', '140px Anton', 150, 330, GOLD, 'rgba(0,0,0,0.85)', gl, 1, 'left');
    ctx.restore();
    if (t > c.deuce + 0.25) { ctx.save(); ctx.globalAlpha = a * inv(c.deuce + 0.25, c.deuce + 0.45, t); ctx.font = '600 30px Oswald'; ctx.fillStyle = BONE; ctx.textAlign = 'left'; ctx.fillText('WEST 54TH ST.   ·   NEVER MISSED', 158, 380); ctx.fillStyle = RED; ctx.fillRect(158, 396, 120 * eOut(inv(c.deuce + 0.25, c.deuce + 0.6, t)), 5); ctx.restore(); }
  }
  if (t >= c.ghost && t < 8.0) {
    const k = inv(c.ghost, c.ghost + 0.18, t), s = lerp(2.6, 1, eOut(k)), a = 1 - inv(7.65, 7.95, t);
    const gl = Math.max(0, 1.4 - (t - c.ghost) * 4) + (hash(Math.floor(t * 20) + 5) < 0.15 ? 0.6 : 0);
    ctx.save(); ctx.globalAlpha = a * Math.min(1, k * 3);
    ctx.translate(1770, 330); ctx.scale(s, s); ctx.translate(-1770, -330);
    glitchTextT('???', '140px Anton', 1770, 330, '#d8f6ff', 'rgba(0,40,60,0.85)', gl, 7, 'right');
    ctx.restore();
    if (t > c.ghost + 0.25) { ctx.save(); ctx.globalAlpha = a * inv(c.ghost + 0.25, c.ghost + 0.45, t); ctx.font = '600 30px Oswald'; ctx.fillStyle = BONE; ctx.textAlign = 'right'; ctx.fillText('NO RECORD   ·   NO ADDRESS', 1762, 380); ctx.fillStyle = '#7fdcff'; const w = 120 * eOut(inv(c.ghost + 0.25, c.ghost + 0.6, t)); ctx.fillRect(1762 - w, 396, w, 5); ctx.restore(); }
  }
}
// glitch text drawn through the current transform
function glitchTextT(txt, font, x, y, color, shadow, amt, seed, align) {
  tctx.setTransform(1, 0, 0, 1, 0, 0); tctx.clearRect(0, 0, W, 420);
  tctx.font = font; tctx.textAlign = align; tctx.textBaseline = 'alphabetic';
  if (shadow) { tctx.fillStyle = shadow; tctx.fillText(txt, x + 7, 287); }
  tctx.fillStyle = color; tctx.fillText(txt, x, 280);
  if (amt > 0.02) { const ga = ctx.globalAlpha; ctx.globalCompositeOperation = 'lighter'; ctx.globalAlpha = ga * Math.min(0.7, amt); ctx.drawImage(tcv, -12 * amt, y - 280); ctx.drawImage(tcv, 12 * amt, y - 280); ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = ga; }
  const n = 14, sh = 420 / n, fr = Math.floor(T * 24);
  for (let i = 0; i < n; i++) {
    const dx = amt > 0.02 && hash(seed * 31 + i * 7 + fr * 3) < 0.45 ? (hash(seed + i * 13 + fr) - 0.5) * 160 * amt : 0;
    ctx.drawImage(tcv, 0, i * sh, W, sh, dx, y - 280 + i * sh, W, sh);
  }
}
function subs(t) {
  for (const s of Q.subs) {
    if (t < s.t0 || t > s.t1) continue;
    const a = Math.min(inv(s.t0, s.t0 + 0.12, t), 1 - inv(s.t1 - 0.12, s.t1, t));
    ctx.save(); ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = a;
    ctx.font = '600 36px Oswald'; ctx.textBaseline = 'middle'; ctx.textAlign = 'left';
    const who = s.who + '  ', w1 = ctx.measureText(who).width;
    ctx.font = '400 36px Oswald'; const w2 = ctx.measureText(s.line).width;
    const x = W / 2 - (w1 + w2) / 2, y = H - BAR / 2;
    ctx.font = '600 36px Oswald'; ctx.fillStyle = s.who === '???' ? '#8fe3ff' : RED; ctx.fillText(who, x, y);
    ctx.font = '400 36px Oswald'; ctx.fillStyle = BONE; ctx.fillText(s.line, x + w1, y);
    ctx.restore();
  }
}
function blams(t) {
  for (const b of Q.blam) {
    const a = t - b.t; if (a < 0 || a > 0.5) continue;
    const s = a < 0.1 ? eBack(a / 0.1) : 1, al = 1 - inv(0.38, 0.5, a);
    ctx.save(); ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = al;
    ctx.translate(b.x, b.y); ctx.rotate(b.r * D2R); ctx.scale(s, s);
    ctx.fillStyle = GOLD; ctx.strokeStyle = INK; ctx.lineWidth = 9; ctx.lineJoin = 'miter';
    star(ctx, 0, 0, 13, 170, 105, b.t); ctx.fill(); ctx.stroke();
    ctx.font = '96px Anton'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.lineWidth = 12; ctx.strokeText('BLAM!', 0, 4); ctx.fillStyle = RED; ctx.fillText('BLAM!', 0, 4);
    ctx.restore();
  }
}
function titleCard(t) {
  const T0 = Q.title.t, u = t - T0;
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);
  ctx.save(); ctx.globalCompositeOperation = 'lighter';
  for (let i = 0; i < 7; i++) { const x = W / 2 + Math.sin(u * 0.3 + i * 1.7) * 520 + (i - 3) * 120, y = 640 + Math.cos(u * 0.25 + i) * 120 - u * 14 * (i % 3); glow(x, y, 520 + 80 * Math.sin(i), 'rgba(150,15,35,A)', 0.32); }
  ctx.restore();
  const z = 1 + 0.035 * u;
  ctx.save(); ctx.translate(W / 2, 520); ctx.scale(z, z); ctx.translate(-W / 2, -520);
  const gl = Math.max(0, 1.6 - u * 5) + (hash(Math.floor(t * 18)) < 0.05 ? 0.35 : 0);
  ctx.globalAlpha = Math.min(1, u * 12);
  glitchTextT('GHOST POST', '250px Anton', W / 2, 600, BONE, 'rgba(215,38,61,0.95)', gl, 3, 'center');
  ctx.globalAlpha = 1;
  const sw = eOut(inv(Q.title.slash, Q.title.slash + 0.3, t));
  ctx.fillStyle = RED; ctx.beginPath(); ctx.moveTo(W / 2 - 560, 650); ctx.lineTo(W / 2 - 560 + 1120 * sw, 638); ctx.lineTo(W / 2 - 560 + 1120 * sw, 652); ctx.lineTo(W / 2 - 560, 664); ctx.fill();
  ctx.restore();
  ctx.save(); ctx.globalAlpha = inv(T0 + 0.15, T0 + 0.6, t); ctx.font = '600 30px Oswald'; ctx.fillStyle = 'rgba(244,239,230,0.8)'; ctx.textAlign = 'center';
  ctx.letterSpacing = '14px'; ctx.fillText('V U E I O   P R E S E N T S', W / 2, 330); ctx.restore();
  typed(Q.typed[2], t);
  const fo = inv(Q.title.fadeOut, Q.title.end, t);
  if (fo > 0) { ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.fillStyle = `rgba(0,0,0,${fo})`; ctx.fillRect(0, 0, W, H); }
}

// ---------- post ----------
function post(t, rt) {
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1;
  ctx.save(); ctx.globalCompositeOperation = 'lighter';
  for (const l of LIGHTS) glow(l.x, l.y, l.r, l.c, l.a);
  ctx.restore();
  const btk = 1 - inv(Q.bt.minSpeed, 1, speedAt(t));
  if (btk > 0.01) {
    ctx.save();
    ctx.globalCompositeOperation = 'saturation'; ctx.fillStyle = `rgba(128,128,128,${0.75 * btk})`; ctx.fillRect(0, 0, W, H);
    ctx.globalCompositeOperation = 'multiply'; ctx.fillStyle = `rgba(150,195,235,${0.45 * btk})`; ctx.fillRect(0, 0, W, H);
    ctx.globalCompositeOperation = 'screen'; ctx.fillStyle = `rgba(20,40,70,${0.35 * btk})`; ctx.fillRect(0, 0, W, H);
    ctx.restore();
  }
  // flash frames
  let fl = 0;
  if (t >= Q.draw && t < Q.draw + 0.15) fl = 1 - (t - Q.draw) / 0.15;
  if (t >= Q.bt.snap && t < Q.bt.snap + 0.18) fl = Math.max(fl, 0.85 * (1 - (t - Q.bt.snap) / 0.18));
  if (fl > 0) { ctx.fillStyle = `rgba(255,248,235,${fl})`; ctx.fillRect(0, 0, W, H); }
  ctx.drawImage(vignette, 0, 0);
  ctx.save(); ctx.globalCompositeOperation = 'overlay'; ctx.globalAlpha = 0.14;
  ctx.drawImage(grains[Math.floor(t * 30) % 4], 0, 0, W, H); ctx.restore();
}
function letterbox() { ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, BAR); ctx.fillRect(0, H - BAR, W, BAR); }

// ---------- master ----------
function render(t) {
  T = t; RT = warp(t); LIGHTS = [];
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over'; ctx.filter = 'none';
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);
  computeShake(t);
  if (t >= Q.title.t) { titleCard(t); return; }
  if (t >= 8.0 && t < 9.6) shotEyes(t);
  else if (t >= 9.6 && t < 10.4) shotHand(t);
  else if (t >= 10.4 && t < 11.8) shotGhostClose(t);
  else if (t >= Q.reload.start && t < Q.reload.end) shotReload(t, RT);
  else { camFor(t, RT); street(t, RT); }
  post(t, RT);
  letterbox();
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  typed(Q.typed[0], t); typed(Q.typed[1], t);
  nameCards(t); blams(t); subs(t);
  const fin = 1 - inv(0, 0.9, t);
  if (fin > 0) { ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.fillStyle = `rgba(0,0,0,${fin})`; ctx.fillRect(0, 0, W, H); }
}

window.render = render;
Promise.all(['140px Anton', '600 30px Oswald', '400 30px Oswald', '30px "Special Elite"'].map(f => document.fonts.load(f)))
  .then(() => document.fonts.ready)
  .then(() => { window.READY = true; });
</script>
